services:
  - type: web
    name: rango-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node Controller.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
